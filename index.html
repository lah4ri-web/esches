<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESCHÉS</title>
<style>
:root{--bg:#0e0e0e;--pn:#151515;--ln:#262626;--hv:#1d1d1d;--tx:#ececec;--mu:#8a8a8a;--dm:#5c5c5c;--lt:#EBECD0;--dk:#739552;--bs:min(calc(100vh - 190px),calc(50vw - 88px));
font-family:"Inter","SF Pro Text","Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"cv11","ss03";-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
#app{display:grid;grid-template-columns:1fr 1px 1fr;height:100vh}
#L{display:flex;align-items:center;justify-content:center;min-width:0}#col{width:var(--bs)}
#crumb{height:24px;margin-bottom:20px;color:var(--mu);font-size:13px;letter-spacing:.01em;display:flex;gap:8px}#crumb b{color:var(--tx);font-weight:500}
#board{position:relative;width:var(--bs);height:var(--bs);display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);user-select:none;touch-action:none;contain:strict}
.sq{position:relative;background:var(--dk)}.sq.l{background:var(--lt)}
.sq i{position:absolute;inset:0;pointer-events:none}.hl{background:rgba(255,255,51,.5)}
.ck{background:radial-gradient(circle,rgba(255,0,0,.8),rgba(255,0,0,.35) 50%,transparent 75%)}
.dot{inset:auto!important;left:34%;top:34%;width:32%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.2)}
.cap{inset:auto!important;left:5%;top:5%;width:90%;aspect-ratio:1;border-radius:50%;border:calc(var(--bs)/80) solid rgba(0,0,0,.2)}
.pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.co{position:absolute;font-size:calc(var(--bs)/8*.17);line-height:1;pointer-events:none;z-index:1}
.cf{left:5%;bottom:5%}.cr{right:5%;top:5%}.l .co{color:var(--dk)}.d .co{color:var(--lt)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:5}
.pp{position:absolute;width:12.5%;z-index:6;background:#f2f2f2;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.pp button{display:block;width:100%;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;transition:background .12s}.pp button:hover{background:#ddd}.pp img{width:100%;height:100%}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:4}
#cap{display:flex;justify-content:space-between;align-items:center;height:40px;margin-top:12px;color:var(--mu);font-size:13px}
#cap b{color:var(--tx);font-weight:500;font-size:14px}#cap .ctl{display:flex;gap:18px}
.tb{background:none;border:0;color:var(--mu);cursor:pointer;padding:4px 0;font-size:13px;transition:color .15s}.tb:hover{color:var(--tx)}
#note{min-height:20px;font-size:13px;color:var(--mu);margin-top:4px}#note.e{color:#d98b8b}
#sp{background:var(--ln)}#P{background:var(--pn);overflow-y:auto;padding:0 56px 64px}
.top{display:flex;justify-content:space-between;height:68px;align-items:center;font-size:13px;color:var(--mu)}
.top button{background:none;border:0;color:var(--mu);cursor:pointer;transition:color .15s;padding:0}.top button:hover{color:var(--tx)}
.v{animation:in .22s cubic-bezier(.2,.7,.2,1)}@keyframes in{from{opacity:0;transform:translateY(6px)}}
h1{font-size:28px;font-weight:500;letter-spacing:-.022em;line-height:1.2;margin:34px 0 10px}
.sub{color:var(--mu);margin:0 0 30px;max-width:46ch}
.lbl{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--dm);margin:34px 0 10px;display:flex;justify-content:space-between}
.act{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:17px 0;cursor:pointer;font-size:15px;font-weight:500;transition:background .15s,padding .2s,opacity .15s}
.act:hover{background:var(--hv);padding-left:14px;padding-right:14px}.act:active{opacity:.7}.act.on{background:var(--hv)}
.r{color:var(--mu);font-weight:400;font-size:13px}
.mt{display:grid;grid-template-columns:62px 1fr auto;column-gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:15px 0;cursor:pointer;transition:background .15s,padding .2s}
.mt:hover{background:var(--hv);padding-left:14px;padding-right:14px}.mv{font-weight:600;font-size:15px}.mv i{font-style:normal;color:var(--mu);font-weight:400}
.nmx{color:var(--tx);font-size:14px}.dim{color:var(--mu);font-size:13px}.mt .nmx{grid-column:2}
.pb{height:3px;background:var(--ln);width:96px;margin-top:6px;border-radius:2px;overflow:hidden}.pb i{display:block;height:100%;background:#cfcfcf;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.big.pb{width:100%;height:4px;margin:0 0 6px}
.rb{display:flex;height:18px;width:150px;font-size:11px;font-weight:600;border-radius:2px;overflow:hidden}.rb span{display:flex;align-items:center;padding:0 5px;min-width:0;overflow:hidden}
.rb .w{background:#e4e4e4;color:#111}.rb .d{background:#6a6a6a;color:#fff}.rb .b{background:#050505;color:#eee;justify-content:flex-end}
.cols{display:grid;grid-template-columns:62px 1fr auto auto auto;column-gap:18px}
.in{width:100%;background:none;border:0;border-bottom:1px solid var(--ln);padding:14px 34px 14px 0;outline:0;font-size:15px;transition:border-color .2s}.in:focus{border-color:var(--mu)}
.fw{position:relative}.fw u{position:absolute;right:2px;top:13px;text-decoration:none;font-size:15px}.ok{color:#9ad39a}.no{color:#d98b8b}
.ta{width:100%;height:90px;background:none;border:1px solid var(--ln);padding:12px;outline:0;resize:vertical}
.tag{font-size:10px;letter-spacing:.1em;color:var(--dm);border:1px solid var(--ln);padding:1px 6px;border-radius:2px;margin-left:8px}
.cd{border-left:1px solid var(--mu);padding:2px 0 2px 16px;margin:0 0 24px;color:#cfcfcf}.cd small{display:block;color:var(--mu);margin-top:6px}
.g{width:100%;height:90px;display:block;cursor:pointer;background:#101010}
#ld{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(10,10,10,.4);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .5s,backdrop-filter .5s}
#ld.on{opacity:1;pointer-events:all}#ld>*{transition:opacity .45s,filter .45s;filter:blur(10px);opacity:0}#ld.on>*{filter:none;opacity:1}
#ld .t{letter-spacing:.5em;margin-right:-.5em;font-size:20px;font-weight:500}#ld .s{font-size:12px;color:#aaa;min-height:16px}
.kn{width:44px;height:44px;background:linear-gradient(105deg,#666 35%,#fff 50%,#666 65%) 130% 0/260% 100%;animation:sh 1.8s linear infinite;-webkit-mask:var(--kn) center/contain no-repeat;mask:var(--kn) center/contain no-repeat}
@keyframes sh{to{background-position:-130% 0}}
@media(max-width:900px){:root{--bs:calc(100vw - 32px)}#app{display:block;height:auto}#L{padding:16px 0}#sp{height:1px}#P{padding:0 20px 48px;overflow:visible}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

function pracAns(m){const P=S.prac,it=P.it,san=B.hist[B.hist.length-1].san,ok=it.e.sans.includes(san);it.e.int=ok?Math.max(1,Math.round((it.e.int||0)*2.3)):0;it.e.due=Date.now()+(ok?it.e.int*864e5:6e5);sv();B.lock=true;
 if(!ok){undo();B.lock=true}P.st=ok?'ok':'bad';P.san=san;view()}
function vPrac(){const P=S.prac;if(P.empty)return`<h1>${Object.keys(reps.w).length+Object.keys(reps.b).length?'All caught up':'No lines yet'}</h1><p class="sub">${Object.keys(reps.w).length+Object.keys(reps.b).length?'Nothing is due for review.':'Build a repertoire first. Lines you choose are saved here and practiced offline.'}</p>`+act('home','Back');
 const it=P.it,s=P.st;return`<h1>${s==='think'?'Find the move':s==='ok'?'Correct':'Not quite'}</h1><p class="sub">${s==='think'?'Play the move from your '+(it.c==='w'?'White':'Black')+' repertoire.':s==='ok'?esc(P.san)+' is in your repertoire.':'You played '+esc(P.san)+'.'}</p>`
 +(s!=='think'?`<div class="cd">Your saved move${it.e.sans.length>1?'s':''}: ${esc(it.e.sans.join(', '))}<small>${s==='ok'?'Next review in '+it.e.int+' day'+(it.e.int>1?'s':''):'Back in 10 minutes'}</small></div>`+act('pnext','Next position'):act('pshow','Show answer'))}
/* games */
const gs=g=>{const mv=g.mv.split(' '),st=[R.parse(R.START)],hs=[];for(const s of mv){const m=R.fromSan(st[st.length-1],s);if(!m)throw new Error('Malformed game: could not read move "'+s+'".');hs.push({m,san:R.san(st[st.length-1],m)});st.push(R.make(st[st.length-1],m))}return{st,hs}};
function vGames(){setPos(R.START,'w',true);B.on=null;cap('');const L=games.slice().sort((a,b)=>b.t-a.t);let h='<h1>Games</h1>';
 if(!L.length)h+=`<div class="cd">CONNECT ACCOUNT<small>Retrieved games appear here for analysis. Nothing is shown until real games are retrieved.</small></div>`+act('settings','Open data source settings');
 else{h+=lbl(L.length+' imported');h+=L.slice(0,S.show).map(g=>{const op=g.col==='w'?g.black:g.white;return`<button class="mt" data-a="og" data-p="${esc(g.id)}" style="grid-template-columns:1fr auto"><span><span class="nmx" style="font-weight:500">${esc(op)}</span><br><span class="dim">${esc(g.open||'Unknown opening')} · ${esc(g.tc||'')} · ${new Date(g.t).toLocaleDateString()}</span></span><span class="r ${g.res==='win'?'ok':g.res==='loss'?'no':''}">${g.res==='win'?'Won':g.res==='loss'?'Lost':'Draw'}${anl[g.id]?' · analyzed':''}</span></button>`}).join('');
  if(L.length>S.show)h+=act('mg','Show more');const m=meta[cfg.site];if(cfg.site==='chesscom'&&m&&m.i<m.a.length)h+=act('older','Fetch older games',m.i+' of '+m.a.length+' archives');if(cfg.site==='lichess'&&m&&!m.done)h+=act('older','Fetch older games')}
 return h+lbl('Add a game from PGN','LOCAL')+'<textarea class="ta" id="pgn" placeholder="Paste a PGN"></textarea>'+act('addpgn','Add game')}
function openGame(id){const g=games.find(x=>x.id===id);try{const{st,hs}=gs(g);S.g={g,st,hs};S.v='game';B.on=null;B.lock=true;B.o=g.col;setPly(0);view()}catch(e){note(e.message,1)}}
function setPly(k){const G=S.g;k=Math.max(0,Math.min(G.hs.length,k));S.ply=k;B.s=G.st[k];B.keys=[R.key(B.s)];B.last=k?{f:G.hs[k-1].m.f,t:G.hs[k-1].m.t}:null;B.sel=null;B.lg=[];B.promo=null;B.lock=true;drawBoard();
 cap(`<b>${esc(G.g.open||'')}</b>`,'<button class="tb" data-a="ply" data-p="'+(k-1)+'">‹ Previous</button><button class="tb" data-a="ply" data-p="'+(k+1)+'">Next ›</button><button class="tb" data-a="flip">Flip</button>');
 const gr=$('#gph');if(gr)view()}
function vGame(){const G=S.g,g=G.g,A=anl[g.id];let h=`<h1 style="font-size:22px">${esc(g.white)} vs ${esc(g.black)}</h1><p class="sub">${g.res==='win'?'Won':g.res==='loss'?'Lost':'Draw'} as ${g.col==='w'?'White':'Black'} · ${esc(g.open||'Unknown opening')}</p>`;
 if(A){const n=G.hs.length,W=300,pts=A.ev.map((c,i)=>(i/n*W).toFixed(1)+','+(45-Math.max(-1000,Math.min(1000,c))/1000*43).toFixed(1)).join(' ');
  h+=`<svg id="gph" class="g" data-a="graph" viewBox="0 0 ${W} 90" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="45" y2="45" stroke="#444" stroke-width=".5"/><polyline points="${pts}" fill="none" stroke="#ddd" stroke-width="1.2" vector-effect="non-scaling-stroke"/><line x1="${S.ply/n*W}" x2="${S.ply/n*W}" y1="0" y2="90" stroke="#888" vector-effect="non-scaling-stroke"/></svg><p class="dim">Evaluation ${fe(A.ev[S.ply])} · Stockfish depth ${A.d}</p>`;
  const ms=A.cl.map((c,i)=>({c,i})).filter(x=>x.c);h+=lbl('Critical moments')+(ms.length?ms.map(x=>`<button class="mt" data-a="ply" data-p="${x.i+1}" style="grid-template-columns:1fr auto"><span class="mv">${mlabel(x.i,G.hs[x.i].san)}</span><span class="r">${x.c} · ${esc(x.cl||'')}</span></button>`).join(''):'<p class="dim">None found.</p>')}
 else h+=act('anl','Analyze with Stockfish',A?'':'Requires vendor/stockfish.js');
 let ml='';G.hs.forEach((m,i)=>ml+=(i%2?'':`<span class="dim" style="margin-left:10px">${(i>>1)+1}.</span> `)+`<a data-a="ply" data-p="${i+1}" style="cursor:pointer;padding:2px 5px;${i+1===S.ply?'background:var(--hv)':''}">${esc(m.san)}</a>`);
 return h+lbl('Moves')+`<div style="line-height:2">${ml}</div>`}
async function analyze(){const G=S.g,g=G.g;try{const ev=[];await busy(async()=>{for(let i=0;i<G.st.length;i++){ldt(`Analyzing ${i+1} / ${G.st.length}`);const r=await evalFen(R.fen(G.st[i]),12);ev.push(r.cp);G.d=r.depth}},'Stockfish analysis');
  const cl=G.hs.map((h,i)=>{const sg=G.st[i].t==='w'?1:-1,loss=Math.max(0,sg*(Math.max(-1000,Math.min(1000,ev[i]))-Math.max(-1000,Math.min(1000,ev[i+1]))));return loss>=300?'Blunder':loss>=150?'Mistake':loss>=70?'Inaccuracy':''}).map((c,i)=>c?c:'');
  anl[g.id]={ev,d:G.d,cl};
  anl[g.id].cl=cl.map(c=>c);sv()}catch(e){note(e.message,1)}view()}
function vIns(){setPos(R.START,'w',true);cap('');if(!games.length)return'<h1>Insights</h1><div class="cd">CONNECT ACCOUNT<small>Insights are computed only from games you have retrieved.</small></div>'+act('settings','Open data source settings');
 const st={};for(const g of games){if(!g.open)continue;const k=g.col+g.open,s=st[k]||(st[k]={n:0,p:0,col:g.col,o:g.open});s.n++;s.p+=g.res==='win'?1:g.res==='draw'?.5:0}
 const A=Object.values(st).filter(s=>s.n>=3).sort((a,b)=>b.p/b.n-a.p/a.n),row=s=>`<div class="act" style="cursor:default"><span>${esc(s.o)} <span class="dim">as ${s.col==='w'?'White':'Black'}</span></span><span class="r">${Math.round(s.p/s.n*100)}% · ${s.n} games</span></div>`;
 return`<h1>Insights</h1><p class="sub">From ${games.length} retrieved games. Draws count half. Openings need three or more games.</p>`+lbl('Strongest')+(A.slice(0,4).map(row).join('')||'<p class="dim">Not enough games.</p>')+lbl('Weakest')+(A.slice(-4).reverse().map(row).join('')||'<p class="dim">Not enough games.</p>')+`<p class="dim" style="margin-top:28px">Pattern detection from engine analysis and “train this” extraction are not built yet.</p>`}
/* settings */
function vSet(){const s=cfg.site;return`<h1>Settings</h1>`+lbl('Data source')+['chesscom','lichess'].map(k=>act('site',(cfg.site===k?'● ':'○ ')+SITE[k].n,'',k).replace('class="act"',`class="act${cfg.site===k?' on':''}"`)).join('')
 +lbl('Username')+`<div class="fw"><input class="in" id="uname" placeholder="${SITE[s].n} username" value="${esc(cfg.names[s])}" autocomplete="off" spellcheck="false"><u id="us"></u></div><div style="height:12px"></div>`+act('connect','Retrieve games')
 +lbl('Display and sound')+act('snd','Sound',cfg.sound?'On':'Off')+act('crd','Board coordinates',cfg.coords?'On':'Off')
 +lbl('Lichess API token','Optional')+`<input class="in" id="tok" type="password" placeholder="Needed only if the explorer returns 401" value="${esc(cfg.token)}"><p class="dim">The board, pieces, colors and sounds follow the data source above.</p>`
 +lbl('Data on this device','LOCAL')+`<p class="dim">${rcount('w')+rcount('b')} repertoire positions · ${games.length} games</p>`+act('exp','Export data (JSON)')+act('erase','Erase local data')
 +lbl('ESCHÉS account')+act('x','ESCHÉS SYNC','COMING SOON').replace('data-a="x"','disabled style="opacity:.5;cursor:default"')}
/* actions */
const hist=[];const nav=(v,fn)=>{hist.push({v:S.v,c:S.c});fn()};
const home=()=>{S.v='home';B.on=null;B.lock=false;view()};
const ACT={open:p=>nav('rep',()=>startRep(p)),prac:()=>nav('prac',nextPrac),pnext:nextPrac,pshow:()=>{const it=S.prac.it;S.prac.st='bad';S.prac.san='(answer shown)';it.e.int=0;it.e.due=Date.now()+6e5;sv();B.lock=true;view()},
 games:()=>nav('games',()=>{S.v='games';view()}),ins:()=>nav('ins',()=>{S.v='ins';view()}),settings:()=>{if(S.v!=='set')hist.push({v:S.v,c:S.c});S.v='set';view()},
 back(){if(S.v==='rep'&&S.path.length){undo();S.path.pop();return repLoad()}if(S.v==='game'){S.v='games';return view()}const h=hist.pop();if(!h)return home();if(h.v==='rep'&&S.v!=='rep')return startRep(h.c);S.v=h.v;if(h.v==='home')return home();view()},
 home,flip(){B.o=B.o==='w'?'b':'w';drawBoard()},retry:repLoad,more(){S.lim+=8;view()},mg(){S.show+=30;view()},pick,
 site(p){cfg.site=p;sv();ust='';view();drawBoard();if(cfg.names[p])checkUser()},connect:()=>connect(false),older:()=>connect(true),og:openGame,ply:p=>setPly(+p),anl:analyze,
 graph(p,el,e){const r=el.getBoundingClientRect();setPly(Math.round((e.clientX-r.left)/r.width*S.g.hs.length))},
 snd(){cfg.sound=!cfg.sound;sv();view()},crd(){cfg.coords=!cfg.coords;sv();view();drawBoard()},
 exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({cfg:{...cfg,token:''},reps,games,notes,anl},null,1)],{type:'application/json'}));a.download='esches-data.json';a.click()},
 erase(){if(confirm('Erase all ESCHÉS data on this device?')){Object.keys(localStorage).filter(k=>k.startsWith('esches.')).forEach(k=>localStorage.removeItem(k));location.reload()}},
 addpgn(){const t=$('#pgn').value.trim(),mv=parseMoves(t);if(!mv.length){note('Paste a PGN first.',1);return}const tg=k=>(t.match(new RegExp('\\['+k+' "([^"]*)"'))||[])[1];
  const g={id:'pgn:'+Date.now().toString(36),site:'local',col:'w',white:tg('White')||'White',black:tg('Black')||'Black',res:'draw',tc:'pgn',t:Date.now(),open:tg('Opening')||'',mv:mv.join(' ')};
  try{gs(g)}catch(e){note(e.message,1);return}addGames([g]);note('Game added.');view()}};
document.addEventListener('click',e=>{if(e.target.closest('#board'))return;const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f)f(el.dataset.p,el,e)});
document.addEventListener('input',e=>{if(e.target.id==='uname'){cfg.names[cfg.site]=e.target.value;ust='';paintU();sv()}if(e.target.id==='tok'){cfg.token=e.target.value.trim();sv()}if(e.target.id==='nt'){notes['n:'+R.key(B.s)]=e.target.value;sv()}});
document.addEventListener('change',e=>{if(e.target.id==='uname')checkUser()});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)){if(e.target.id==='uname'&&e.key==='Enter')checkUser();return}
 if(S.v==='game'){if(e.key==='ArrowLeft')setPly(S.ply-1);if(e.key==='ArrowRight')setPly(S.ply+1)}if(e.key==='f')ACT.flip()});
$('#kn').style.setProperty('--kn',`url("${PCS.lichess.wN}")`);
home();
</script></body></html>
