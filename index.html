<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESCHÉS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#111214;--panel:#202124;--row:#2c2e33;--line:#2b2d31;--tx:#ececee;--mu:#8d9097;--ok:#6cbf5a;--wa:#e2a93b;--bad:#e8665c;--lt:#eedbbc;--dk:#b08a68;
--bs:min(calc(100vh - 150px),calc(100vw - 520px),780px);font-family:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif}
[data-theme=light]{--bg:#e9e7e2;--panel:#fbfaf8;--row:#eeece7;--line:#e2dfd8;--tx:#1b1c1e;--mu:#777a80}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx)}
button,input,textarea,select{font-family:inherit}
#wrap{display:flex;justify-content:center;min-height:100vh}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;min-width:0;max-width:960px}
#col{width:var(--bs)}
#crumb{height:26px;margin-bottom:22px;font-weight:500;color:var(--mu);font-size:17px;display:flex;gap:9px;align-items:center;white-space:nowrap}
#crumb b{color:var(--tx);font-weight:500}
#crumb .wm2{letter-spacing:.28em;font-size:12px;font-weight:600}
#board{position:relative;width:var(--bs);height:var(--bs);user-select:none;-webkit-user-select:none;touch-action:none;background:var(--dk);overflow:hidden;contain:strict}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}
.sq i{position:absolute;pointer-events:none}
.hl{inset:0;background:rgba(255,214,0,.38)}
.sel{inset:0;background:rgba(40,190,100,.42)}
.chk{inset:0;background:radial-gradient(circle,rgba(255,40,40,.85) 0,rgba(255,40,40,.4) 45%,transparent 72%)}
.dot,.cap{z-index:3;height:auto}
.dot{left:35%;top:35%;width:30%;aspect-ratio:1/1;border-radius:50%;background:rgba(20,20,20,.28)}
.cap{left:4%;top:4%;width:92%;aspect-ratio:1/1;border-radius:50%;border:calc(var(--bs)/90) solid rgba(20,20,20,.3)}
.pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.co{position:absolute;font-size:calc(var(--bs)/36);font-weight:500;line-height:1;pointer-events:none;z-index:1}
.cf{left:4%;bottom:4%}.cr{right:5%;top:4%}
.l .co{color:var(--dk)}.d .co{color:var(--lt)}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.bar{display:flex;gap:18px;margin-top:14px;color:var(--mu);font-size:14px;height:24px}
.bar button{background:none;border:0;color:inherit;font-size:14px;cursor:pointer;padding:2px 0}
.bar button:hover{color:var(--tx)}
#note{margin-top:8px;font-size:14px;color:var(--mu);min-height:20px}
#note.err{color:var(--bad)}
#side{width:440px;flex:none;background:var(--panel);height:100vh;position:sticky;top:0;overflow-y:auto}
.hd{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0;font-size:14px}
.wm{letter-spacing:.32em;font-weight:600;font-size:13px}
.gear{background:none;border:0;color:var(--mu);font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center;padding:0}
.gear:hover{color:var(--tx)}
.view{padding-top:64px;padding-bottom:50px}
.back{padding:0 24px;color:var(--mu);cursor:pointer;margin-bottom:38px;font-size:16px;width:max-content}
.back:hover{color:var(--tx)}
.sec{display:flex;justify-content:space-between;align-items:center;color:var(--mu);padding:0 24px;font-size:16px;margin:36px 0 14px}
.sec.first{margin-top:0}
.sec [data-a]{cursor:pointer;font-size:14px}.sec [data-a]:hover{color:var(--tx)}
.row{display:flex;align-items:center;gap:12px;padding:17px 24px;background:var(--row);margin-bottom:10px;cursor:pointer;font-weight:500;font-size:17px}
.row:hover{filter:brightness(1.12)}
.row.plain{background:none;border-bottom:1px solid var(--line);margin:0;font-size:16px}
.row.static{cursor:default}.row.static:hover{filter:none}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r{margin-left:auto;color:var(--mu);font-size:14px;font-weight:400;white-space:nowrap}
.dotc{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid var(--mu)}
.dotc.w{background:#fff;border-color:#fff}
.bd{font-size:10px;letter-spacing:.14em;border:1px solid var(--line);border-radius:3px;padding:2px 5px;color:var(--mu);font-weight:500}
.bd.cn{color:var(--ok);border-color:rgba(108,191,90,.4)}
.big{font-size:30px;font-weight:500;padding:0 24px;margin:0 0 20px;line-height:1.15}
.hint{padding:0 24px;margin:-8px 0 22px;color:var(--mu);font-size:15px;line-height:1.5}
.stat{padding:0 24px 20px}.stat b{font-weight:500;font-size:17px}
.bar2{height:5px;background:var(--line);margin-top:10px;border-radius:2px;overflow:hidden}.bar2 i{display:block;height:100%}
.stats{display:flex;gap:22px;padding:0 24px;font-size:13px;color:var(--mu)}.stats div{display:flex;flex-direction:column;gap:5px}.stats b{color:var(--tx);font-size:16px;font-weight:500}
.line{padding:0 24px;font-size:16px;line-height:1.6;min-height:26px}
.chips{padding:0 24px;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--row);padding:8px 12px;font-weight:500;cursor:pointer;font-size:15px}
.chip em{font-style:normal;color:var(--mu);margin-left:9px}.chip em:hover{color:var(--bad)}
.seg{display:flex;padding:0 24px;gap:0;margin-bottom:14px}
.seg button{flex:1;padding:11px;background:var(--row);border:0;color:var(--mu);cursor:pointer;font-size:15px;font-weight:500}
.seg button.on{background:var(--tx);color:var(--panel)}
.inp{display:flex;padding:0 24px;gap:10px;margin-bottom:12px}
.inp input,.ta{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:11px 12px;font-size:15px;outline:none;min-width:0}
.inp input:focus,.ta:focus{border-color:var(--mu)}
.btn{background:var(--tx);color:var(--panel);border:0;padding:11px 16px;font-weight:500;cursor:pointer;font-size:15px}
.ta{display:block;width:calc(100% - 48px);margin:0 24px 10px;height:90px;resize:vertical}
.tabs{display:flex;padding:0 24px;border-bottom:1px solid var(--line);gap:22px;margin-bottom:22px;overflow-x:auto}
.tabs span{padding:12px 0;color:var(--mu);cursor:pointer;font-size:15px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs span.on{color:var(--tx);border-color:var(--tx)}
.empty{padding:0 24px 20px}.empty b{display:block;font-weight:600;letter-spacing:.06em;font-size:15px;margin-bottom:8px}.empty p{margin:0;color:var(--mu);line-height:1.5;font-size:15px}
.good{color:var(--ok)}.badc{color:var(--bad)}.warn{color:var(--wa)}
.legend{padding:30px 24px 0;color:var(--mu);font-size:12px;line-height:1.8}
.meta{padding:0 24px;margin:-10px 0 14px;color:var(--mu);font-size:14px}
.nav{display:flex;padding:0 24px;gap:8px;margin-bottom:12px}
.nav button{flex:1;background:var(--row);border:0;color:var(--tx);padding:9px;cursor:pointer;font-size:16px}
.gr{padding:0 24px;margin-bottom:14px}.gr svg{width:100%;height:84px;display:block;background:var(--bg);cursor:pointer}
.card{margin:0 24px 18px;padding:14px 16px;background:var(--row);font-size:15px;line-height:1.55}
.card small{display:block;color:var(--mu);margin-top:8px;font-size:12px}
.ml{padding:0 24px;display:grid;grid-template-columns:34px 1fr 1fr;font-size:15px;max-height:230px;overflow-y:auto;margin-bottom:10px}
.ml span.n{color:var(--mu);padding:5px 0}
.ml span.m{padding:5px 8px;cursor:pointer;font-weight:500}
.ml span.m:hover{background:var(--row)}.ml span.m.cur{background:var(--row);outline:1px solid var(--mu)}
.c-blunder{color:var(--bad)}.c-mistake{color:#e98a4b}.c-inaccuracy{color:var(--wa)}
#ld{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(10,10,12,.35);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);opacity:0;pointer-events:none;transition:opacity .7s ease,backdrop-filter .7s ease,-webkit-backdrop-filter .7s ease}
#ld.on{opacity:1;pointer-events:all;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#ld .inner{display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;filter:blur(10px);transition:opacity .45s ease,filter .45s ease}
#ld.on .inner{opacity:1;filter:blur(0)}
#ld .ttl{letter-spacing:.5em;margin-right:-.5em;font-weight:500;font-size:22px;color:#f3f3f4}
#ld .sub{font-size:12px;color:#b9bbc0;min-height:16px;letter-spacing:.04em}
.kn{width:46px;height:46px;background:linear-gradient(105deg,#6b6d73 35%,#fff 50%,#6b6d73 65%);background-size:260% 100%;animation:shine 1.8s linear infinite;-webkit-mask:var(--kn) center/contain no-repeat;mask:var(--kn) center/contain no-repeat}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
@media(prefers-reduced-motion:reduce){.kn{animation:none}}
#pal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:16vh;background:rgba(0,0,0,.4)}
#pal.on{display:flex}
#pal div.box{width:min(520px,92vw);background:var(--panel);border:1px solid var(--line)}
#pal input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:16px;color:var(--tx);font-size:16px;outline:none}
#pal .it{padding:12px 16px;cursor:pointer;font-size:15px}#pal .it.on,#pal .it:hover{background:var(--row)}
@media(max-width:980px){
 :root{--bs:min(calc(100vw - 24px),78vh)}
 #wrap{flex-direction:column;align-items:center}
 #stage{padding:14px 12px;max-width:none;width:100%}
 #side{width:100%;height:auto;position:static;overflow:visible}
 .view{padding-top:28px}
}
</style>
</head>
<body>
<div id="wrap">
 <main id="stage"><div id="col"><div id="crumb"></div><div id="board"></div><div class="bar" id="bar"></div><div id="note"></div></div></main>
 <aside id="side"></aside>
</div>
<div id="ld" class="on"><div class="inner"><div class="kn" id="kn"></div><div class="ttl">ESCHÉS</div><div class="sub" id="ldsub"></div></div></div>
<div id="pal"><div class="box"><input id="palq" placeholder="Type a command" autocomplete="off"><div id="pall"></div></div></div>

<script>
/* ============ asset / dependency config ============ */
// Local copies are tried first (put chess.min.js in /vendor and the 12 SVGs in /vendor/pieces for fully offline use).
const CHESS_SRC=['vendor/chess.min.js','https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js'];
const PIECE_BASE=['vendor/pieces/','https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/'];
let CHESS_URL='';const PU={};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('esches.'+k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem('esches.'+k,JSON.stringify(v));return true}catch(e){toast('Local storage is full. Export or erase data in Settings.',1);return false}}};
function toast(m,err){const n=$('#note');n.textContent=m||'';n.className=err?'err':''}
const V={p:100,n:320,b:330,r:500,q:900,k:0};
const PN={p:'a pawn',n:'a knight',b:'a bishop',r:'a rook',q:'the queen'};

/* ============ persisted state ============ */
const mkRep=(id,name,color)=>({id,name,color,nodes:{},paths:{},srs:{}});
let cfg=Object.assign({site:'chesscom',names:{chesscom:'',lichess:''},theme:'dark',sound:true,coords:true,months:6},LS.get('cfg',{}));
let reps=LS.get('reps',null)||[mkRep('white','White openings','w'),mkRep('black','Black openings','b')];
let games=LS.get('games',[]),anl=LS.get('anl',{}),trn=LS.get('trn',[]),gmeta=LS.get('gmeta',{});
const saveReps=()=>LS.set('reps',reps),saveGames=()=>{LS.set('games',games);LS.set('gmeta',gmeta)};

/* ============ board state ============ */
const B={chess:null,orient:'w',sel:null,legal:new Set(),last:null,arrows:[],mode:'free',lock:false,dragging:null};
const S={view:'home',repId:null,gid:null,ply:0,tc:'all',show:40,prac:null,tr:null,A:null,prev:'home',newColor:'w'};
const key=f=>f.split(' ').slice(0,4).join(' ');
const curRep=()=>reps.find(r=>r.id===S.repId)||reps[0];

/* ============ boot ============ */
function loadScript(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no();document.head.appendChild(s)})}
async function loadChess(){for(const u of CHESS_SRC){try{await loadScript(u);if(window.Chess){CHESS_URL=new URL(u,location.href).href;return}}catch(e){}}throw new Error('chess.js could not be loaded')}
async function loadPieces(){const miss=[];
 await Promise.all(['w','b'].flatMap(c=>'PNBRQK'.split('').map(t=>({c,t}))).map(async({c,t})=>{
  for(const b of PIECE_BASE){const u=b+c+t+'.svg';
   const ok=await new Promise(r=>{const im=new Image();im.onload=()=>r(im.naturalWidth>0);im.onerror=()=>r(false);im.src=u});
   if(ok){PU[c+t]=u;return}}
  miss.push(c+t)}));
 return miss}
(async function boot(){
 document.documentElement.dataset.theme=cfg.theme;
 let fatal=null,miss=[];
 try{await loadChess();miss=await loadPieces()}catch(e){fatal=e.message}
 if(PU.wN)$('#kn').style.setProperty('--kn','url("'+PU.wN+'")');
 if(fatal){$('#side').innerHTML='<div class="view"><div class="empty"><b>COULD NOT START</b><p>'+esc(fatal)+'. Check your connection or add vendor/chess.min.js.</p></div></div>';$('#ld').classList.remove('on');return}
 B.chess=new Chess();render();
 if(miss.length)toast('Piece images failed to load: '+miss.join(', ')+'. Add them to vendor/pieces/.',1);
 $('#ld').classList.remove('on');
})();

/* ============ loading overlay (real async only) ============ */
let ldN=0;
async function withLoading(fn,label){
 ldN++;$('#ldsub').textContent=label||'';$('#ld').classList.add('on');
 await new Promise(r=>requestAnimationFrame(r));
 try{return await fn()}finally{if(--ldN===0){$('#ld').classList.remove('on')}}}
const ldText=t=>{$('#ldsub').textContent=t};

/* ============ sound (synthesized) ============ */
let AC;function sound(k){if(!cfg.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();
 o.type='triangle';o.frequency.value=k==='cap'?160:k==='chk'?540:300;g.gain.setValueAtTime(.16,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(k==='cap'?.14:.08));o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.15)}catch(e){}}
const sndFor=m=>/[+#]/.test(m.san)?'chk':m.captured?'cap':'mv';

/* ============ board rendering ============ */
const PT={p:'P',n:'N',b:'B',r:'R',q:'Q',k:'K'};
function arrowSvg(){
 if(!B.arrows.length)return'';const fl=B.orient==='b';
 const P=sq=>{const c='abcdefgh'.indexOf(sq[0]),r=8-+sq[1];return[(fl?7-c:c)+.5,(fl?7-r:r)+.5]};
 let s='<svg class="arrows" viewBox="0 0 8 8"><defs>';
 const cols={g:'#4fbf6a',r:'#e8665c',y:'#e2a93b'};
 for(const k in cols)s+='<marker id="ah'+k+'" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="'+cols[k]+'"/></marker>';
 s+='</defs>';
 for(const a of B.arrows){const[x1,y1]=P(a.from),[x2,y2]=P(a.to);const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,sh=.28;
  s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+(x2-dx/l*sh)+'" y2="'+(y2-dy/l*sh)+'" stroke="'+cols[a.c||'g']+'" stroke-width=".16" stroke-linecap="round" opacity=".85" marker-end="url(#ah'+(a.c||'g')+')"/>'}
 return s+'</svg>'}
function renderBoard(){
 const g=B.chess,fl=B.orient==='b',bd=g.board();let h='',ck=null;
 if(g.in_check()){const t=g.turn();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=bd[r][c];if(p&&p.type==='k'&&p.color===t)ck='abcdefgh'[c]+(8-r)}}
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const rank=7-r,sq='abcdefgh'[c]+(rank+1),dx=fl?7-c:c,dy=fl?7-r:r,light=(c+rank)%2===1;
  h+='<div class="sq '+(light?'l':'d')+'" data-sq="'+sq+'" style="left:'+dx*12.5+'%;top:'+dy*12.5+'%">';
  if(B.last&&(B.last.from===sq||B.last.to===sq))h+='<i class="hl"></i>';
  if(B.sel===sq)h+='<i class="sel"></i>';
  if(ck===sq)h+='<i class="chk"></i>';
  if(cfg.coords){if(dy===7)h+='<b class="co cf">'+'abcdefgh'[c]+'</b>';if(dx===7)h+='<b class="co cr">'+(rank+1)+'</b>'}
  const p=bd[r][c];
  if(p&&B.dragging!==sq)h+='<img class="pc" src="'+PU[p.color+PT[p.type]]+'" draggable="false" alt="">';
  if(B.legal.has(sq))h+=p?'<i class="cap"></i>':'<i class="dot"></i>';
  h+='</div>'}
 $('#board').innerHTML=h+arrowSvg()}

function renderBar(){
 let b='<button data-a="flip" title="Flip board (F)">Flip board</button>';
 if(B.mode==='free'||B.mode==='build')b+='<button data-a="undo">Undo</button>';
 if(B.mode==='free')b+='<button data-a="resetb">Reset</button>';
 if(B.mode==='free'||B.mode==='build')b+='<button data-a="engine">Engine</button>';
 $('#bar').innerHTML=b}
function renderCrumb(){
 const v=S.view,rp=curRep();
 const m={rep:rp&&rp.name,build:rp&&rp.name+' › Build',practice:'Practice',train:'Train mistakes',games:'Games',insights:'Insights',settings:'Settings',newrep:'New repertoire',analysis:S.A?S.A.gm.white+' vs '+S.A.gm.black:''};
 $('#crumb').innerHTML=v==='home'?'':'<span class="wm2">ESCHÉS</span><span>›</span><b>'+esc(m[v]||'')+'</b>'}
function statusText(){const g=B.chess;if(g.in_checkmate())return'Checkmate · '+(g.turn()==='w'?'Black':'White')+' wins';if(g.in_stalemate())return'Stalemate';if(g.in_draw())return'Draw';return''}
function render(){renderBoard();renderBar();renderCrumb();renderSide();
 const st=(B.mode==='free'||B.mode==='build')?statusText():'';if(st)toast(st)}

/* ============ move input (click + drag) ============ */
const bdEl=$('#board');let drag=null;
function sqAt(x,y){const r=bdEl.getBoundingClientRect();let c=Math.floor((x-r.left)/r.width*8),rr=Math.floor((y-r.top)/r.height*8);
 if(c<0||c>7||rr<0||rr>7)return null;if(B.orient==='b'){c=7-c;rr=7-rr}return'abcdefgh'[c]+(8-rr)}
function selectSq(sq){B.sel=sq;B.legal=new Set(B.chess.moves({square:sq,verbose:true}).map(m=>m.to));renderBoard()}
bdEl.addEventListener('pointerdown',e=>{
 if(B.lock||B.mode==='analysis'||e.button>0)return;const sq=sqAt(e.clientX,e.clientY);if(!sq)return;
 const g=B.chess,p=g.get(sq);
 if(B.sel&&B.legal.has(sq)){attempt(B.sel,sq);return}
 if(p&&p.color===g.turn()){selectSq(sq);drag={sq,x:e.clientX,y:e.clientY,on:false,pc:p.color+PT[p.type]};try{bdEl.setPointerCapture(e.pointerId)}catch(_){}}
 else{B.sel=null;B.legal=new Set();renderBoard()}});
bdEl.addEventListener('pointermove',e=>{
 if(!drag)return;
 if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5){drag.on=true;B.dragging=drag.sq;
  const s=bdEl.getBoundingClientRect().width/8,im=document.createElement('img');im.src=PU[drag.pc];
  im.style.cssText='position:fixed;left:0;top:0;width:'+s+'px;height:'+s+'px;pointer-events:none;z-index:50';document.body.appendChild(im);drag.im=im;renderBoard()}
 if(drag.on){const s=bdEl.getBoundingClientRect().width/8;drag.im.style.transform='translate('+(e.clientX-s/2)+'px,'+(e.clientY-s/2)+'px)'}});
bdEl.addEventListener('pointerup',e=>{
 if(!drag)return;const d=drag;drag=null;if(d.im)d.im.remove();B.dragging=null;
 if(d.on){const to=sqAt(e.clientX,e.clientY);if(to&&to!==d.sq&&B.legal.has(to)){attempt(d.sq,to);return}renderBoard()}});
bdEl.addEventListener('pointercancel',()=>{if(drag){if(drag.im)drag.im.remove();drag=null;B.dragging=null;renderBoard()}});

function attempt(from,to){
 const g=B.chess,fenB=g.fen(),histB=g.history(),m=g.move({from,to,promotion:'q'});if(!m)return;
 B.sel=null;B.legal=new Set();

/* ============ engine (Web Worker pool, built-in shallow alpha-beta) ============ */
function workerMain(){
 const V={p:100,n:320,b:330,r:500,q:900,k:0};let g,dl=0,nodes=0;
 function ev(){const b=g.board();let s=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;let v=V[p.type];const cd=Math.min(c,7-c)+Math.min(r,7-r);
   if(p.type==='n')v+=cd*8;else if(p.type==='b')v+=cd*4;
   else if(p.type==='p'){const adv=p.color==='w'?6-r:r-1;v+=adv*6+(c>=2&&c<=5?adv*2:0)}
   s+=p.color==='w'?v:-v}
  return g.turn()==='w'?s:-s}
 function order(ms){for(const m of ms)m.o=(m.captured?1000+10*V[m.captured]-V[m.piece]/10:0)+(m.promotion?800:0)+(m.san.indexOf('+')>0?50:0);ms.sort((a,b)=>b.o-a.o);return ms}
 function chk(){if((++nodes&255)===0&&Date.now()>dl)throw 0}
 function qs(a,b,d){chk();const st=ev();if(st>=b)return b;if(st>a)a=st;if(d===0)return a;
  const ms=order(g.moves({verbose:true}).filter(m=>m.captured||m.promotion));
  for(const m of ms){g.move(m);const s=-qs(-b,-a,d-1);g.undo();if(s>=b)return b;if(s>a)a=s}return a}
 function nm(d,a,b,ply){chk();if(g.in_checkmate())return -30000+ply;if(g.in_draw())return 0;if(d===0)return qs(a,b,4);
  const ms=order(g.moves({verbose:true}));let best=-Infinity;
  for(const m of ms){g.move(m);const s=-nm(d-1,-b,-a,ply+1);g.undo();if(s>best)best=s;if(s>a)a=s;if(a>=b)break}return best}
 function root(d,first){let ms=order(g.moves({verbose:true}));if(first){ms=ms.filter(m=>m.san===first.san).concat(ms.filter(m=>m.san!==first.san))}
  let a=-Infinity,best=null,bs=-Infinity;
  for(const m of ms){g.move(m);const s=-nm(d-1,-Infinity,-a,1);g.undo();if(s>bs){bs=s;best=m}if(s>a)a=s}return{best,bs}}
 onmessage=e=>{const d=e.data;
  if(d.init){try{importScripts(d.url);postMessage({ready:1})}catch(x){postMessage({err:String(x)})}return}
  g=new Chess(d.fen);const w=g.turn()==='w';
  if(g.in_checkmate()){postMessage({id:d.id,cp:w?-30000:30000,best:null,depth:0});return}
  if(g.in_draw()){postMessage({id:d.id,cp:0,best:null,depth:0});return}
  dl=Date.now()+d.ms;nodes=0;let res=null,depth=0;
  for(let k=1;k<=10;k++){try{const r=root(k,res&&res.best);res=r;depth=k;if(Math.abs(r.bs)>29000)break}catch(x){break}
   if(Date.now()>dl)break}
  if(!res){const ms=g.moves({verbose:true});res={best:ms[0],bs:0}}
  const b=res.best;postMessage({id:d.id,cp:w?res.bs:-res.bs,depth,best:b&&{san:b.san,from:b.from,to:b.to,captured:b.captured||'',piece:b.piece}})}}
let pool=[],engP=null;
function initEngine(){
 if(engP)return engP;
 engP=new Promise((res,rej)=>{
  const n=Math.max(1,Math.min(4,(navigator.hardwareConcurrency||2)-1));
  const url=URL.createObjectURL(new Blob(['('+workerMain.toString()+')()'],{type:'text/javascript'}));let ready=0;
  for(let i=0;i<n;i++){const w=new Worker(url);
   w.onmessage=e=>{if(e.data.err){rej(new Error(e.data.err));return}if(e.data.ready&&++ready===n)res()};
   w.onerror=ev=>rej(new Error('Engine worker failed'));
   w.postMessage({init:1,url:CHESS_URL});pool.push(w)}});
 engP.catch(()=>{engP=null;pool=[]});return engP}
function evalMany(fens,ms,prog){
 return initEngine().then(()=>new Promise((resolve,reject)=>{
  const out=new Array(fens.length);let next=0,done=0;if(!fens.length)return resolve(out);
  const feed=w=>{if(next<fens.length){const i=next++;w.postMessage({id:i,fen:fens[i],ms})}};
  pool.forEach(w=>{w.onmessage=e=>{const d=e.data;out[d.id]=d;done++;if(prog)prog(done,fens.length);if(done===fens.length)resolve(out);else feed(w)};w.onerror=()=>reject(new Error('Engine worker failed'));feed(w)})}))}
const fmt=cp=>{if(cp==null)return'–';if(Math.abs(cp)>25000)return(cp>0?'+':'−')+'M'+Math.ceil((30000-Math.abs(cp))/2);return(cp>0?'+':cp<0?'−':'')+Math.abs(cp/100).toFixed(1)};
const cl=x=>Math.max(-1000,Math.min(1000,x));

/* ============ games: chess.js helpers ============ */
function gameChess(gm){const c=new Chess();
 if(gm.fmt==='san'){for(const s of gm.mv.split(' ')){if(s&&!c.move(s,{sloppy:true}))break}}
 else c.load_pgn('[Event "x"]\n\n'+gm.mv,{sloppy:true});
 return c}
function gameFens(gm){const h=gameChess(gm).history({verbose:true}),r=new Chess(),f=[r.fen()];for(const m of h){r.move(m.san,{sloppy:true});f.push(r.fen())}return{hist:h,fens:f}}
const phase=(i,fen)=>i<20?'opening':(fen.split(' ')[0].replace(/[^qrbnQRBN]/g,'').length<=6?'endgame':'middlegame');

async function analyzeGame(gm,prog){
 const{hist,fens}=gameFens(gm);if(!hist.length)throw new Error('This game has no moves');
 const res=await evalMany(fens,170,prog);const ev=res.map(x=>x.cp),plies=[];
 hist.forEach((m,i)=>{
  const sg=m.color==='w'?1:-1,b=res[i],a=res[i+1],loss=Math.max(0,sg*(cl(ev[i])-cl(ev[i+1]))),bs=b.best?b.best.san:null;
  const cls=(m.san===bs||loss<=10)?'best':loss<70?'good':loss<150?'inaccuracy':loss<300?'mistake':'blunder';
  let tag='';
  if(loss>=70){
   if(sg*ev[i]>25000&&sg*ev[i+1]<=25000)tag='missed mate';
   else if(sg*ev[i+1]<-25000)tag='allowed mate';
   else if(a.best&&a.best.captured&&V[a.best.captured]>=300&&loss>=150)tag='hung piece';
   else if(b.best&&b.best.captured&&!m.captured&&loss>=100)tag='missed capture';
   else tag='positional'}
  plies.push({s:m.san,c:m.color,loss:Math.round(loss),cls,tag,bs,bf:b.best&&b.best.from,bt:b.best&&b.best.to,rs:a.best&&a.best.san,rc:(a.best&&a.best.captured)||'',ph:phase(i,fens[i])})});
 anl[gm.id]={ev,plies,d:Math.max.apply(null,res.map(x=>x.depth||0))};LS.set('anl',anl);return anl[gm.id]}

 return'<h1 class="big">Build</h1><p class="hint">Play any move on the board and it is saved to '+esc(rp.name)+'. '+(mine?'Your move.':'Opponent\'s move.')+'</p>'
 +'<div class="sec first"><span>Current line</span></div><div class="line">'+(esc(fmtLine(g.history()))||'Starting position')+'</div>'
 +'<div class="sec"><span>Saved from here</span></div>'+(kids.length?'<div class="chips">'+kids.map(s=>'<span class="chip" data-a="bplay" data-p="'+esc(s)+'">'+esc(s)+'<em data-a="bdel" data-p="'+esc(s)+'">×</em></span>').join('')+'</div>':'<div class="line" style="color:var(--mu)">Nothing saved here yet.</div>')
 +'<div class="sec"></div>'+row('undo',null,'Undo move')+row('breset',null,'Back to start')}
function sPractice(){

function sTrain(){

 const it=t.item,side=B.chess.turn()==='w'?'White':'Black';
 return'<h1 class="big">'+(t.state==='ok'?'Correct':t.state==='retry'?'Try again':'Train this position')+'</h1>'

 +(t.state==='ok'?row('tnext',it.id,'Next position'):row('tshow',null,'Show answer'))}

function sAnalysis(){
 const{gm,a,hist}=S.A,k=S.ply,n=hist.length;
 const rs=gm.res==='win'?'Won':gm.res==='loss'?'Lost':'Draw';
 let h='<h1 class="big" style="font-size:24px">'+esc(gm.white)+' vs '+esc(gm.black)+'</h1><div class="meta">'+rs+' as '+(gm.color==='w'?'White':'Black')+' · '+esc(gm.open||'Unknown opening')+' · '+esc(gm.tc||'')+(gm.url?' · <a style="color:var(--mu)" target="_blank" rel="noopener" href="'+esc(gm.url)+'">source</a>':'')+'</div>';
 h+='<div class="nav"><button data-a="ply" data-p="0">⏮</button><button data-a="ply" data-p="'+(k-1)+'">‹</button><button data-a="ply" data-p="'+(k+1)+'">›</button><button data-a="ply" data-p="'+n+'">⏭</button></div>';
 const W=300,pts=a.ev.map((c,i)=>(i/Math.max(1,n)*W).toFixed(1)+','+(42-cl(c)/1000*40).toFixed(1)).join(' ');
 h+='<div class="gr"><svg data-a="graph" viewBox="0 0 '+W+' 84" preserveAspectRatio="none"><line x1="0" y1="42" x2="'+W+'" y2="42" stroke="#555" stroke-dasharray="2 3" stroke-width=".6"/><polyline points="'+pts+'" fill="none" stroke="var(--ok)" stroke-width="1.4" vector-effect="non-scaling-stroke"/><line x1="'+(k/Math.max(1,n)*W)+'" y1="0" x2="'+(k/Math.max(1,n)*W)+'" y2="84" stroke="var(--wa)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg></div>';
 h+='<div class="meta" style="margin-top:0">Evaluation '+fmt(a.ev[k])+' (positive favors White) · built-in engine, depth ≈ '+a.d+'</div>';
 if(k>0){const p=a.plies[k-1];
  h+='<div class="card"><b class="'+(p.loss>=70?'c-'+p.cls:'')+'">'+Math.ceil(k/2)+(p.c==='w'?'. ':'… ')+esc(p.s)+(p.cls==='blunder'?' ??':p.cls==='mistake'?' ?':p.cls==='inaccuracy'?' ?!':'')+'</b><br>'+esc(explain(gm,a,k-1))+'<small>Heuristic explanation from a shallow search. A green arrow shows the stronger move.</small></div>';
  if(p.loss>=70&&p.bf&&p.c===gm.color)h+=row('trainthis',String(k-1),'Train this position',trn.some(t=>t.id===gm.id+':'+(k-1))?'Saved':'')}
 h+='<div class="sec"><span>Moves</span></div><div class="ml">';
 for(let i=0;i<n;i+=2){h+='<span class="n">'+(i/2+1)+'</span>';
  for(let j=i;j<i+2;j++){if(j<n){const p=a.plies[j];h+='<span class="m'+(j+1===k?' cur':'')+' '+(p.loss>=70?'c-'+p.cls:'')+'" data-a="ply" data-p="'+(j+1)+'">'+esc(p.s)+'</span>'}else h+='<span></span>'}}
 h+='</div><div class="sec"><span>Critical moments</span></div>';
 const crit=a.plies.map((p,i)=>({p,i})).filter(x=>x.p.loss>=150);
 h+=crit.length?crit.map(x=>'<div class="row" data-a="ply" data-p="'+(x.i+1)+'"><span class="t '+'c-'+x.p.cls+'">'+Math.ceil((x.i+1)/2)+(x.p.c==='w'?'. ':'… ')+esc(x.p.s)+'</span><span class="r">'+(x.p.c===gm.color?'You':'Opponent')+' · '+esc(x.p.tag)+' · −'+(x.p.loss/100).toFixed(1)+'</span></div>').join(''):'<div class="line" style="color:var(--mu)">No large swings found at this search depth.</div>';
 return h}

function sInsights(){
 const tcs=['all'].concat([...new Set(games.map(g=>g.tc).filter(Boolean))]);
 const gs=games.filter(g=>S.tc==='all'||g.tc===S.tc);
 let h='<h1 class="big">Insights</h1>';
 if(!games.length)return h+'<div class="empty"><b>CONNECT YOUR CHESS ACCOUNT</b><p>Analyze your games to discover recurring patterns and training opportunities.</p></div>'+row('settings',null,'Open account settings','');
 h+='<div class="tabs">'+tcs.map(t=>'<span data-a="tc" data-p="'+t+'" class="'+(S.tc===t?'on':'')+'">'+(t==='all'?'All games':t[0].toUpperCase()+t.slice(1))+'</span>').join('')+'</div>';
 const st={};for(const g of gs){if(!g.open)continue;const k=g.color+'|'+g.open;const s=st[k]||(st[k]={n:0,w:0,d:0,l:0,color:g.color,name:g.open});s.n++;if(g.res==='win')s.w++;else if(g.res==='loss')s.l++;else s.d++}
 const arr=Object.values(st).filter(s=>s.n>=3).map(s=>({...s,sc:(s.w+s.d/2)/s.n}));
 const line=s=>'<div class="row static plain"><span class="dotc '+(s.color==='w'?'w':'')+'"></span><span class="t">'+esc(s.name)+'</span><span class="r '+(s.sc>.5?'good':s.sc<.5?'badc':'')+'">'+Math.round(s.sc*100)+'% · '+s.w+'-'+s.d+'-'+s.l+'</span></div>';
 const best=arr.filter(s=>s.sc>.5).sort((a,b)=>b.sc-a.sc||b.n-a.n).slice(0,3),worst=arr.filter(s=>s.sc<.5).sort((a,b)=>a.sc-b.sc||b.n-a.n).slice(0,3);
 h+='<div class="sec first"><span>Best openings</span><span>Score · W-D-L</span></div>'+(best.length?best.map(line).join(''):'<div class="line" style="color:var(--mu)">Needs an opening with 3+ games and a winning score.</div>');
 h+='<div class="sec"><span>Worst openings</span><span>Score · W-D-L</span></div>'+(worst.length?worst.map(line).join(''):'<div class="line" style="color:var(--mu)">Needs an opening with 3+ games and a losing score.</div>');
 h+='<div class="hint" style="margin-top:14px">Based on '+gs.length+' imported games. Score counts a draw as half a point.</div>';
 const ag=gs.filter(g=>anl[g.id]);
 h+='<div class="sec"><span>Patterns from analysis</span><span>'+ag.length+' analyzed</span></div>';
 if(ag.length){
  const ph={opening:0,middlegame:0,endgame:0},tg={};let tot=0,bl=0;
  for(const g of ag)for(const p of anl[g.id].plies){if(p.c!==g.color||p.loss<150)continue;tot++;ph[p.ph]++;tg[p.tag]=(tg[p.tag]||0)+1;if(p.cls==='blunder')bl++}
  if(!tot)h+='<div class="line" style="color:var(--mu)">No mistakes of 1.5 pawns or more found at this search depth.</div>';
  else{const pk=Object.entries(ph).sort((a,b)=>b[1]-a[1])[0],tk=Object.entries(tg).sort((a,b)=>b[1]-a[1]);
   h+='<div class="row static plain"><span class="t">Serious mistakes</span><span class="r">'+tot+' ('+(tot/ag.length).toFixed(1)+' per game, '+bl+' blunders)</span></div>'
   +'<div class="row static plain"><span class="t">Most in the '+pk[0]+'</span><span class="r">'+pk[1]+' of '+tot+'</span></div>'
   +tk.slice(0,3).map(x=>'<div class="row static plain"><span class="t">'+esc(x[0])+'</span><span class="r">'+x[1]+'×</span></div>').join('')}
  h+=row('trainall',null,'Add my mistakes to training','')}
 const un=gs.filter(g=>!anl[g.id]).length;
 if(un)h+=row('batch',null,'Analyze next '+Math.min(5,un)+' games',un+' unanalyzed');
 return h}

const parent=()=>({rep:'home',build:'rep',practice:S.prac&&S.prac.scope!=='all'?'rep':'home',train:'home',games:'home',insights:'home',newrep:'home',analysis:'games',settings:['home','rep','games','insights'].includes(S.prev)?S.prev:'home'})[S.view]||'home';
function go(v,p){
 const was=S.view;
 if(v==='home'||v==='rep'||v==='games'||v==='insights'||v==='settings'||v==='newrep'){
  if(v==='settings'&&was!=='settings')S.prev=was;
  S.view=v;B.mode='free';B.lock=false;B.sel=null;B.legal=new Set();
  if(['practice','train','build','analysis'].includes(was)||v==='rep'){B.chess=new Chess();B.last=null;B.arrows=[];B.orient=v==='rep'?curRepFor(p).color:(v==='home'?'w':B.orient)}
  if(v==='rep'&&p)S.repId=p;
  if(v==='rep'){B.orient=curRep().color}
  if(was==='analysis'){S.A=null}
  render();return}
 if(v==='build')startBuild()}
function curRepFor(p){return reps.find(r=>r.id===p)||curRep()}
const ACT={
 flip(){B.orient=B.orient==='w'?'b':'w';renderBoard();renderCrumb()},
 undo(){if(B.chess.undo()){const h=B.chess.history({verbose:true});B.last=h.length?{from:h[h.length-1].from,to:h[h.length-1].to}:null;B.arrows=[];toast('');B.sel=null;B.legal=new Set();render()}},
 resetb(){B.chess=new Chess();B.last=null;B.arrows=[];B.sel=null;B.legal=new Set();toast('');render()},
 async engine(){const g=B.chess;if(g.game_over())return;try{const r=(await withLoading(()=>evalMany([g.fen()],1500),'Engine analysis'))[0];
   B.arrows=r.best?[{from:r.best.from,to:r.best.to,c:'g'}]:[];renderBoard();toast('Built-in engine (shallow, depth '+r.depth+'): '+fmt(r.cp)+' · best move '+(r.best?r.best.san:'none'))}catch(e){toast(e.message,1)}},
 settings(){go('settings')},back(){go(parent())},
 home(){go('home')},rep(p){go('rep',p)},build(){startBuild()},
 practice(p){startPractice(p,false)},pracall(p){startPractice(p,true)},
 pshow(){const P=S.prac,it=P.item;B.arrows=it.rp.nodes[it.k].map(s=>{const x=sanMove(it.k+' 0 1',s);return x&&{from:x.from,to:x.to,c:'g'}}).filter(Boolean);it.rp.srs[it.k]=srsUpdate(it.rp.srs[it.k],false);saveReps();P.state='bad';P.wrong='(answer shown)';B.lock=true;P.count++;render()},
 pnext(){startPractice(S.prac.scope,S.prac.all)},
 train(){startTrain()},trall(){trn.forEach(t=>t.srs=null);LS.set('trn',trn);startTrain()},
 tshow(){const it=S.tr.item;B.arrows=[{from:it.bf,to:it.bt,c:'g'}];it.srs=srsUpdate(it.srs,false);LS.set('trn',trn);S.tr.state='retry';S.tr.wrong='(answer shown)';renderBoard();renderSide()},
 tnext(p){startTrain(p)},
 bplay(p){const g=B.chess,fenB=g.fen(),hb=g.history(),m=g.move(p,{sloppy:true});if(m){B.last={from:m.from,to:m.to};B.arrows=[];sound(sndFor(m));render()}},
 bdel(p){const rp=curRep();prune(rp,key(B.chess.fen()),p);saveReps();render()},
 breset(){startBuild()},
 delrep(){const rp=curRep();if(confirm('Delete "'+rp.name+'" and all its saved lines from this device?')){reps=reps.filter(r=>r!==rp);saveReps();go('home')}},
 newrep(){S.view='newrep';render()},ncol(p){S.newColor=p;renderSide()},
 mkrep(){const n=($('#rname').value||'').trim();if(!n){toast('Give the repertoire a name.',1);return}
  const id='r'+Date.now().toString(36);reps.push(mkRep(id,n,S.newColor));saveReps();S.repId=id;go('rep',id)},
 games(){go('games')},insights(){go('insights')},
 open(p){openGame(p)},more(){S.show+=40;renderSide()},
 older(){connect(true)},connect(){connect(false)},
 site(p){cfg.site=p;LS.set('cfg',cfg);renderSide()},
 months(){cfg.months=cfg.months>=24?3:cfg.months+3;LS.set('cfg',cfg);renderSide()},

 export(){const b=new Blob([JSON.stringify({cfg,reps,games,anl,trn},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='esches-data.json';a.click()},
 erase(){if(confirm('Erase all ESCHÉS data stored on this device?')){['cfg','reps','games','anl','trn','gmeta'].forEach(k=>localStorage.removeItem('esches.'+k));location.reload()}},
 ply(p){setPly(+p)},
 graph(p,el,e){const r=el.getBoundingClientRect();setPly(Math.round((e.clientX-r.left)/r.width*S.A.hist.length))},
 trainthis(p){const ok=addTrain(S.gid,+p);toast(ok?'Saved to your training positions.':'Already in your training positions.');renderSide()},
 trainall(){let n=0;for(const g of games){const a=anl[g.id];if(!a)continue;a.plies.forEach((p,i)=>{if(p.c===g.color&&p.loss>=150&&addTrain(g.id,i))n++})}toast(n?'Added '+n+' positions to training.':'No new mistake positions to add.');renderSide()},
 tc(p){S.tc=p;renderSide()},
 async batch(){const gs=games.filter(g=>(S.tc==='all'||g.tc===S.tc)&&!anl[g.id]).sort((a,b)=>b.t-a.t).slice(0,5);
  try{await withLoading(async()=>{let i=0;for(const g of gs){i++;try{await analyzeGame(g,(d,n)=>ldText('Game '+i+' of '+gs.length+' · '+d+' / '+n+' positions'))}catch(e){}}},'Analyzing games')}catch(e){toast(e.message,1)}
  render()},
 addpgn(){const t=($('#pgn').value||'').trim();if(!t){toast('Paste a PGN first.',1);return}
  const mv=stripMoves(t);const gm={id:'pgn:'+Date.now().toString(36),site:'local',url:'',color:$('#pgncol').value,white:'White',black:'Black',res:'draw',tc:'pgn',t:Date.now(),open:(t.match(/\[Opening "([^"]+)"/)||[])[1]||'',mv,fmt:'pgn'};
  const w=(t.match(/\[White "([^"]+)"/)||[])[1],b=(t.match(/\[Black "([^"]+)"/)||[])[1],r=(t.match(/\[Result "([^"]+)"/)||[])[1];
  if(w)gm.white=w;if(b)gm.black=b;if(r){const m={'1-0':'w','0-1':'b'}[r];gm.res=m?(m===gm.color?'win':'loss'):'draw'}
  if(!gameChess(gm).history().length){toast('Could not read any moves from that PGN.',1);return}
  addGames([gm]);toast('Game added.');renderSide()}
};

/* ============ command palette ============ */
const CMDS=[['Go to repertoires',()=>go('home')],['Games',()=>go('games')],['Insights',()=>go('insights')],['Settings',()=>go('settings')],['Practice moves',()=>startPractice('all',false)],['Train your mistakes',()=>startTrain()],
 ['Flip board',()=>ACT.flip()],['Toggle theme',()=>ACT.theme()],['Fetch games from connected account',()=>connect(false)],['Add repertoire',()=>ACT.newrep()]];
function togglePal(){const p=$('#pal');if(p.classList.contains('on'))return closePal();p.classList.add('on');$('#palq').value='';palList('');$('#palq').focus()}
function closePal(){$('#pal').classList.remove('on')}
function palList(q){const l=CMDS.filter(c=>c[0].toLowerCase().includes(q.toLowerCase()));
 $('#pall').innerHTML=l.map((c,i)=>'<div class="it'+(i===0?' on':'')+'" data-i="'+CMDS.indexOf(c)+'">'+c[0]+'</div>').join('')}
$('#palq').addEventListener('input',e=>palList(e.target.value));
$('#palq').addEventListener('keydown',e=>{if(e.key==='Enter'){const it=$('#pall .it');if(it){closePal();CMDS[+it.dataset.i][1]()}}});
$('#pall').addEventListener('click',e=>{const it=e.target.closest('.it');if(it){closePal();CMDS[+it.dataset.i][1]()}});
$('#pal').addEventListener('click',e=>{if(e.target.id==='pal')closePal()});
</script>
</body>
</html>
