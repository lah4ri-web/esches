(function(){const t=document.createElement('div');t.id='etip';document.body.appendChild(t);let cur=null;
const skip=e=>e.matches('.sx,.ftip,.tb,#opn');
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el||skip(el)){if(cur){cur=null;t.classList.remove('on')}return}if(el===cur)return;cur=el;t.textContent=el.getAttribute('data-tip');const r=el.getBoundingClientRect();t.classList.add('on');const w=t.offsetWidth,h=t.offsetHeight;t.style.left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2))+'px';t.style.top=(r.top-h-8<6?r.bottom+8:r.top-h-8)+'px'});
document.addEventListener('mouseout',e=>{if(cur&&!(e.relatedTarget&&cur.contains(e.relatedTarget))){cur=null;t.classList.remove('on')}});
document.addEventListener('scroll',()=>{cur=null;t.classList.remove('on')},true)})();
</script></body></html>
